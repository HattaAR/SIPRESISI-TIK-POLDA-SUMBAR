<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Riwayat Persetujuan - SiPresisi TIK</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="images/images-removebg-preview.png" alt="Logo">
                <h4>TIK POLRI</h4>
            </div>
            <div class="sidebar-menu">
                <a href="pimpinan-dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard Pimpinan</a>
                
                <a href="pimpinan-history.html" class="active"><i class="fas fa-check-double"></i> Riwayat Persetujuan</a>
                
                <a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </nav>

        <main class="main-content">
            <div class="top-bar">
                <h2>Riwayat Persetujuan</h2>
                <div class="user-info">
                    <div class="user-text">
                        <h4 id="userNameDisplay">Pimpinan</h4>
                        <small>Kabid TIK</small>
                    </div>
                    <div class="user-avatar" style="background: #fbc02d; color: #333;">P</div>
                </div>
            </div>

            <div class="content-card">
                <h3>Log Keputusan</h3>
                <p style="color:#666; margin-bottom:15px;">Daftar surat yang telah Anda proses (Setuju/Tolak).</p>

                <table border="1" style="width: 100%; border-collapse: collapse; border-color: #eee;">
                    <thead>
                        <tr style="background: #f8f9fa; text-align: left;">
                            <th style="padding: 10px;">Tanggal Proses</th>
                            <th style="padding: 10px;">Pengirim</th>
                            <th style="padding: 10px;">Perihal</th>
                            <th style="padding: 10px;">Keputusan</th>
                            <th style="padding: 10px;">Catatan Anda</th>
                        </tr>
                    </thead>
                    <tbody id="tableHistory">
                        <tr><td colspan="5" style="padding:10px;">⏳ Memuat riwayat...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if(!token) window.location.href = 'login.html';

        async function loadHistory() {
            try {
                // Memanggil backend yang baru saja kita perbaiki
                const res = await fetch('/api/letters/history', { 
                    headers: { 'Authorization': 'Bearer ' + token } 
                });
                const json = await res.json();
                
                const tbody = document.getElementById('tableHistory');
                tbody.innerHTML = '';

                if (!json.data || json.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="padding:20px; text-align:center;">Belum ada riwayat keputusan.</td></tr>';
                    return;
                }

                json.data.forEach(item => {
                    const tanggal = new Date(item.tanggal_proses).toLocaleString('id-ID');
                    
                    // Logika Tampilan Badge Warna-warni
                    let badge = '';
                    if (item.action === 'approve') {
                        badge = `<span style="background:#e8f5e9; color:#2e7d32; padding:5px 10px; border-radius:15px; font-weight:bold; font-size:12px;">DISETUJUI</span>`;
                    } else if (item.action === 'reject') {
                        badge = `<span style="background:#ffebee; color:#c62828; padding:5px 10px; border-radius:15px; font-weight:bold; font-size:12px;">DITOLAK</span>`;
                    }

                    const row = `
                        <tr>
                            <td style="padding: 10px; font-size:13px;">${tanggal}</td>
                            <td style="padding: 10px;">${item.pengirim}</td>
                            <td style="padding: 10px;">
                                <strong>${item.subject}</strong><br>
                                <small style="color:#888;">${item.jenis_surat}</small>
                            </td>
                            <td style="padding: 10px;">${badge}</td>
                            <td style="padding: 10px; font-style:italic; color:#555;">"${item.notes || '-'}"</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) { console.error(err); }
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }

        loadHistory();
    </script>
</body>
</html>
