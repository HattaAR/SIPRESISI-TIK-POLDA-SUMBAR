<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SiPresisi TIK</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-split-body">

    <div class="login-container">
        
        <div class="login-left">
            
            <div class="welcome-text">
                <h2>WELCOME</h2>
                <h1>SIPRESISI TIK</h1>
            </div>

            <div class="login-card">
                <h3>SIGN IN</h3>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" class="form-control-rounded" placeholder="Username" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control-rounded" placeholder="Password Pengguna" required>
                    </div>

                    <button type="submit" class="btn-dark-rounded" id="btnLogin">
                        SIGN IN
                    </button>
                </form>
            </div>

        </div>

        <div class="login-right">
            <div class="right-content">
                <img src="images/images-removebg-preview.png" alt="Logo TIK" class="logo-large">
                
                <h2>BID TIK POLDA SUMBAR</h2>
                <p>Sistem Informasi Persuratan Presisi TIK</p>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const originalText = btn.innerHTML;

            btn.innerHTML = 'LOADING...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.user.role);
                    localStorage.setItem('name', data.user.full_name);

                    // Redirect
                    setTimeout(() => {
                        if (data.user.role === 'admin') window.location.href = 'admin-dashboard.html';
                        else if (data.user.role === 'staff') window.location.href = 'staff-dashboard.html';
                        else if (data.user.role === 'pimpinan') window.location.href = 'pimpinan-dashboard.html';
                    }, 500);
                } else {
                    alert('Login Gagal: ' + data.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi.');
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
